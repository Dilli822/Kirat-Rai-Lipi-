<svg width="100%" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Pretrained vision models used for evaluation and benchmarking</title>
  <desc>Nine pretrained lightweight vision models grouped by architecture family. CNN: MobileNetV4. Hybrid: EdgeNeXt, TinyNet, EfficientFormerV2, FastViT, EfficientFormer. Transformer: EfficientViT, TinyViT, ViT-small/DINOv2. Sourced from the timm library.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .ts { font-size: 12px; font-weight: 400; fill: #4a4a4a; }
      .t  { font-size: 14px; font-weight: 400; fill: #1a1a1a; }

      /* coral — CNN */
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th  { fill: #712B13; }
      .c-coral .ts  { fill: #993C1D; }
      .c-coral polygon { stroke: #993C1D; }

      /* teal — Hybrid */
      .c-teal rect    { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th     { fill: #085041; }
      .c-teal .ts     { fill: #0F6E56; }
      .c-teal polygon { stroke: #0F6E56; }
      .c-teal circle  { stroke: #0F6E56; }

      /* purple — Transformer */
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th  { fill: #3C3489; }
      .c-purple .ts  { fill: #534AB7; }

      /* gray — neutral */
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .ts  { fill: #444441; }

      .divider { stroke: #cccccc; }
    </style>
  </defs>

  <!-- Header -->
  <text class="th" x="340" y="26" text-anchor="middle" font-size="15">Pretrained model pool</text>
  <text class="ts" x="340" y="44" text-anchor="middle">Evaluation &amp; benchmarking  ·  timm library  ·  edge-device focus</text>
  <line x1="40" y1="54" x2="640" y2="54" class="divider" stroke-width="0.5"/>

  <!-- FAMILY A — CNN -->
  <g class="c-coral">
    <rect x="40" y="64" width="600" height="22" rx="4" stroke-width="0.5"/>
    <text class="th" x="340" y="75" text-anchor="middle" dominant-baseline="central">CNN-based</text>
  </g>
  <g class="c-coral">
    <rect x="214" y="96" width="252" height="118" rx="8" stroke-width="0.5"/>
    <rect x="258" y="108" width="164" height="10" rx="2" stroke-width="0.5"/>
    <rect x="270" y="122" width="140" height="10" rx="2" stroke-width="0.5"/>
    <rect x="282" y="136" width="116" height="10" rx="2" stroke-width="0.5"/>
    <text class="th" x="340" y="162" text-anchor="middle" dominant-baseline="central">MobileNetV4</text>
    <text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">mobilenetv4_conv_small</text>
    <text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">e2400_r224_in1k  ·  UIB blocks</text>
  </g>

  <!-- FAMILY B — Hybrid -->
  <g class="c-teal">
    <rect x="40" y="234" width="600" height="22" rx="4" stroke-width="0.5"/>
    <text class="th" x="340" y="245" text-anchor="middle" dominant-baseline="central">Hybrid  (CNN + transformer)</text>
  </g>

  <!-- EdgeNeXt -->
  <g class="c-teal">
    <rect x="40" y="266" width="172" height="118" rx="8" stroke-width="0.5"/>
    <rect x="60" y="278" width="52" height="28" rx="4" stroke-width="0.5"/>
    <polygon points="132,278 152,292 132,306 112,292" fill="none" stroke-width="0.5"/>
    <text class="th" x="126" y="330" text-anchor="middle" dominant-baseline="central">EdgeNeXt</text>
    <text class="ts" x="126" y="346" text-anchor="middle" dominant-baseline="central">edgenext_xx_small</text>
    <text class="ts" x="126" y="362" text-anchor="middle" dominant-baseline="central">1.33 M params</text>
  </g>

  <!-- TinyNet -->
  <g class="c-teal">
    <rect x="254" y="266" width="172" height="118" rx="8" stroke-width="0.5"/>
    <rect x="274" y="278" width="132" height="10" rx="2" stroke-width="0.5"/>
    <rect x="286" y="292" width="108" height="10" rx="2" stroke-width="0.5"/>
    <rect x="298" y="306" width="84" height="10" rx="2" stroke-width="0.5"/>
    <text class="th" x="340" y="330" text-anchor="middle" dominant-baseline="central">TinyNet</text>
    <text class="ts" x="340" y="346" text-anchor="middle" dominant-baseline="central">tinynet_e</text>
    <text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">2.04 M params</text>
  </g>

  <!-- EfficientFormerV2 -->
  <g class="c-teal">
    <rect x="468" y="266" width="172" height="118" rx="8" stroke-width="0.5"/>
    <circle cx="508" cy="292" r="13" fill="none" stroke-width="0.5"/>
    <circle cx="534" cy="292" r="9" fill="none" stroke-width="0.5"/>
    <rect x="548" y="280" width="52" height="24" rx="4" stroke-width="0.5"/>
    <text class="th" x="554" y="330" text-anchor="middle" dominant-baseline="central">EfficientFormerV2</text>
    <text class="ts" x="554" y="346" text-anchor="middle" dominant-baseline="central">efficientformerv2_s0</text>
    <text class="ts" x="554" y="362" text-anchor="middle" dominant-baseline="central">3.60 M params</text>
  </g>

  <!-- FastViT -->
  <g class="c-teal">
    <rect x="147" y="400" width="172" height="118" rx="8" stroke-width="0.5"/>
    <rect x="167" y="412" width="52" height="28" rx="4" stroke-width="0.5"/>
    <polygon points="243,412 263,426 243,440 223,426" fill="none" stroke-width="0.5"/>
    <text class="th" x="233" y="464" text-anchor="middle" dominant-baseline="central">FastViT</text>
    <text class="ts" x="233" y="480" text-anchor="middle" dominant-baseline="central">fastvit_t8</text>
    <text class="ts" x="233" y="496" text-anchor="middle" dominant-baseline="central">4.03 M params</text>
  </g>

  <!-- EfficientFormer -->
  <g class="c-teal">
    <rect x="361" y="400" width="172" height="118" rx="8" stroke-width="0.5"/>
    <circle cx="401" cy="426" r="13" fill="none" stroke-width="0.5"/>
    <circle cx="427" cy="426" r="9" fill="none" stroke-width="0.5"/>
    <rect x="441" y="414" width="52" height="24" rx="4" stroke-width="0.5"/>
    <text class="th" x="447" y="464" text-anchor="middle" dominant-baseline="central">EfficientFormer</text>
    <text class="ts" x="447" y="480" text-anchor="middle" dominant-baseline="central">efficientformer_l1</text>
    <text class="ts" x="447" y="496" text-anchor="middle" dominant-baseline="central">12.29 M params</text>
  </g>

  <!-- FAMILY C — Transformer -->
  <g class="c-purple">
    <rect x="40" y="538" width="600" height="22" rx="4" stroke-width="0.5"/>
    <text class="th" x="340" y="549" text-anchor="middle" dominant-baseline="central">Pure transformer</text>
  </g>

  <!-- EfficientViT -->
  <g class="c-purple">
    <rect x="40" y="570" width="172" height="118" rx="8" stroke-width="0.5"/>
    <rect x="60" y="582" width="132" height="8" rx="2" stroke-width="0.5"/>
    <rect x="60" y="594" width="132" height="8" rx="2" stroke-width="0.5"/>
    <rect x="60" y="606" width="132" height="8" rx="2" stroke-width="0.5"/>
    <text class="th" x="126" y="634" text-anchor="middle" dominant-baseline="central">EfficientViT</text>
    <text class="ts" x="126" y="650" text-anchor="middle" dominant-baseline="central">efficientvit_m0</text>
    <text class="ts" x="126" y="666" text-anchor="middle" dominant-baseline="central">2.35 M params</text>
  </g>

  <!-- TinyViT -->
  <g class="c-purple">
    <rect x="254" y="570" width="172" height="118" rx="8" stroke-width="0.5"/>
    <rect x="286" y="582" width="18" height="16" rx="2" stroke-width="0.5"/>
    <rect x="308" y="582" width="18" height="16" rx="2" stroke-width="0.5"/>
    <rect x="330" y="582" width="18" height="16" rx="2" stroke-width="0.5"/>
    <rect x="286" y="602" width="18" height="16" rx="2" stroke-width="0.5"/>
    <rect x="308" y="602" width="18" height="16" rx="2" stroke-width="0.5"/>
    <rect x="330" y="602" width="18" height="16" rx="2" stroke-width="0.5"/>
    <text class="th" x="340" y="634" text-anchor="middle" dominant-baseline="central">TinyViT</text>
    <text class="ts" x="340" y="650" text-anchor="middle" dominant-baseline="central">tiny_vit_5m_224</text>
    <text class="ts" x="340" y="666" text-anchor="middle" dominant-baseline="central">12.08 M params</text>
  </g>

  <!-- ViT-S DINOv2 -->
  <g class="c-purple">
    <rect x="468" y="570" width="172" height="118" rx="8" stroke-width="0.5"/>
    <rect x="498" y="582" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="516" y="582" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="534" y="582" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="498" y="600" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="516" y="600" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="534" y="600" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="498" y="618" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="516" y="618" width="14" height="14" rx="2" stroke-width="0.5"/>
    <rect x="534" y="618" width="14" height="14" rx="2" stroke-width="0.5"/>
    <text class="th" x="554" y="648" text-anchor="middle" dominant-baseline="central">ViT-S / DINOv2</text>
    <text class="ts" x="554" y="664" text-anchor="middle" dominant-baseline="central">vit_small_patch16</text>
    <text class="ts" x="554" y="680" text-anchor="middle" dominant-baseline="central">SSL pretrained  ·  224</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="708" x2="640" y2="708" class="divider" stroke-width="0.5"/>

  <!-- Source badge -->
  <g class="c-gray">
    <rect x="222" y="718" width="236" height="26" rx="13" stroke-width="0.5"/>
    <text class="ts" x="340" y="731" text-anchor="middle" dominant-baseline="central">Source: timm  ·  PyTorch Image Models</text>
  </g>

  <!-- Legend label -->
  <text class="ts" x="340" y="766" text-anchor="middle" fill="#4a4a4a">Architecture family</text>

  <!-- Legend coral -->
  <rect x="90" y="775" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="ts" x="106" y="785">CNN</text>

  <!-- Legend teal -->
  <rect x="184" y="775" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="200" y="785">Hybrid</text>

  <!-- Legend purple -->
  <rect x="300" y="775" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="316" y="785">Pure transformer</text>

  <!-- Footer note -->
  <text class="ts" x="340" y="820" text-anchor="middle" fill="#4a4a4a">9 models  ·  3 architecture families  ·  1.33 M – 12.29 M parameters</text>
</svg>
